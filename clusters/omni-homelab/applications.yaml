apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-configs
    - name: infrastructure-storage-classes
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./applications
  prune: true
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: forgejo
      namespace: forgejo
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      name: forgejo
      namespace: forgejo
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      name: forgejo
      namespace: forgejo
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: >-
        has(status.applied) && status.applied &&
        status.observedGeneration == metadata.generation
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: >-
        has(status.applied) && status.applied &&
        status.observedGeneration == metadata.generation
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
