---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-operators
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators
  prune: true
  # Keep items next to their consumers in Git, but apply them only after the
  # 1Password chart has installed the OnePasswordItem CRD.
  # Label every OnePasswordItem with infrastructure-stage: secrets.
  patches:
    - target:
        labelSelector: infrastructure-stage=secrets
      patch: |-
        $patch: delete
        apiVersion: v1
        kind: List
        metadata:
          name: stage-filter
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  # HelmRelease dependencies order charts: Piraeus -> 1Password -> the rest.
  # Wait only for the essential charts here so 1Password items can supply the
  # secrets needed by the remaining releases (notably external-dns).
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: connect
      namespace: 1password-connect
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: piraeus-operator
      namespace: piraeus-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-secrets
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-operators
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/operators
  prune: true
  # Complement the operators filter. Retain this Kustomization's name so the
  # existing OnePasswordItems keep their Flux owner during the file move.
  patches:
    - target:
        labelSelector: infrastructure-stage!=secrets
      patch: |-
        $patch: delete
        apiVersion: v1
        kind: List
        metadata:
          name: stage-filter
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
  healthChecks:
    - apiVersion: v1
      kind: Secret
      name: cloudflare-api-secret
      namespace: cert-manager
    - apiVersion: v1
      kind: Secret
      name: cloudflare-api-secret
      namespace: external-dns
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cert-manager
      namespace: cert-manager
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-secrets
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/cluster-issuers
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-piraeus
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-operators
  interval: 1h
  retryInterval: 2m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/linstor-csi
  prune: true
  healthChecks:
    - apiVersion: piraeus.io/v1
      kind: LinstorCluster
      name: piraeus
    - apiVersion: piraeus.io/v1
      kind: LinstorSatellite
      name: ryzen-7
    - apiVersion: piraeus.io/v1
      kind: LinstorSatellite
      name: ryzen-9
    - apiVersion: piraeus.io/v1
      kind: LinstorSatellite
      name: supermicro
    - apiVersion: piraeus.io/v1
      kind: LinstorSatellite
      name: z640
    - apiVersion: apps/v1
      kind: Deployment
      name: linstor-csi-controller
      namespace: piraeus-system
    - apiVersion: apps/v1
      kind: DaemonSet
      name: linstor-csi-node
      namespace: piraeus-system
  healthCheckExprs:
    - apiVersion: piraeus.io/v1
      kind: LinstorCluster
      current: >-
        has(status.conditions) &&
        ['Applied', 'Available', 'Configured'].all(type,
          status.conditions.exists(c, c.type == type && c.status == 'True' &&
            c.observedGeneration == metadata.generation))
    - apiVersion: piraeus.io/v1
      kind: LinstorSatellite
      current: >-
        has(status.conditions) &&
        ['Applied', 'Available', 'Configured'].all(type,
          status.conditions.exists(c, c.type == type && c.status == 'True' &&
            c.observedGeneration == metadata.generation))
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-storage-classes
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-piraeus
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/configs/storage-classes
  prune: true
  wait: true
