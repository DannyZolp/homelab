apiVersion: v1
kind: Secret
metadata:
  name: cluster-secrets
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  # 1password connect
  ONEPASSWORD_CONNECT_TOKEN: "replace-with-connect-token"
  ONEPASSWORD_CONNECT_CREDENTIALS_BASE64: "replace-with-base64-encoded-credentials-json"
  ONEPASSWORD_CLOUDFLARE_ITEM_PATH: "vaults/example-vault/items/example-item"

  # cert-manager
  ACME_EMAIL: "admin@example.com"
  INTERNAL_PKI_ACME_SERVER: "https://pki.example.com/acme/acme/directory"
  INTERNAL_PKI_CA: "replace-with-base64-encoded-ca-bundle"

  # Radar
  RADAR_OIDC_CLIENT_ID: "oidc-client-id"
  RADAR_OIDC_CLIENT_SECRET: "replace-with-radar-oidc-client-secret"
  RADAR_OIDC_ISSUER: "https://sso.management.com"
  RADAR_OIDC_REDIRECT_URI: "https://radar.management.com/auth/callback"
  RADAR_GATEWAY_TLD: "radar.management.com"

  # Forgejo
  ONEPASSWORD_FORGEJO_ADMIN_ITEM_PATH: "vaults/example-vault/items/example-item"
  ONEPASSWORD_FORGEJO_POSTGRES_ITEM_PATH: "vaults/example-vault/items/example-item" # ensure username == forgejo
  FORGEJO_GATEWAY_TLD: "git.public.com"
  # The 1Password item must expose a field named password.
  ONEPASSWORD_FORGEJO_SMTP_ITEM_PATH: "vaults/example-vault/items/smtp-item"
  FORGEJO_SMTP_SERVER: "smtp.example.com"
  FORGEJO_SMTP_PORT: "587"
  FORGEJO_SMTP_USERNAME: "forgejo@example.com"
  FORGEJO_SMTP_FROM: "forgejo@example.com"
