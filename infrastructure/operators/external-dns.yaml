---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: cloudflare-api-secret
  namespace: external-dns
  labels:
    infrastructure-stage: secrets
spec:
  itemPath: "${ONEPASSWORD_CLOUDFLARE_ITEM_PATH}"

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/external-dns/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  dependsOn:
    - name: connect
      namespace: 1password-connect
  interval: 12h
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
  # The 1Password operator creates the API token after this release is applied.
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  values:
    policy: sync
    provider:
      name: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-api-secret
            key: credential
    sources:
      - service
      - gateway-httproute
      - gateway-grpcroute
      - gateway-tlsroute
