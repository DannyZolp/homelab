---
apiVersion: v1
kind: Namespace
metadata:
  name: 1password-connect
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: 1password
  namespace: 1password-connect
spec:
  interval: 24h
  url: https://1password.github.io/connect-helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: connect
  namespace: 1password-connect
spec:
  interval: 12h
  chart:
    spec:
      chart: connect
      sourceRef:
        kind: HelmRepository
        name: 1password
  values:
    operator:
      create: true
      token:
        value: "${ONEPASSWORD_CONNECT_TOKEN}"
    connect:
      credentials_base64: "${ONEPASSWORD_CONNECT_CREDENTIALS_BASE64}"
