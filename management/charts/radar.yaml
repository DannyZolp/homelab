apiVersion: v1
kind: Namespace
metadata:
  name: radar
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: skyhook
  namespace: radar
spec:
  interval: 24h
  url: https://skyhook-io.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radar
  namespace: radar
spec:
  interval: 12h
  chart:
    spec:
      chart: radar
      version: "1.20.3"
      sourceRef:
        kind: HelmRepository
        name: skyhook
  values:
    httpRoute:
      enabled: true
      hostnames:
        - "${RADAR_GATEWAY_TLD}"
      parentRefs:
        - name: radar-gateway
          namespace: radar
    auth:
      mode: oidc
      oidc:
        issuerURL: "${RADAR_OIDC_ISSUER}"
        clientID: "${RADAR_OIDC_CLIENT_ID}"
        existingSecret: radar-oidc
        redirectURL: "${RADAR_OIDC_REDIRECT_URI}"
    helm:
      ociSources:
        - oci://quay.io/cilium/charts
        - oci://ghcr.io/skyhook-io/charts
        - oci://quay.io/jetstack/charts
        - oci://registry.k8s.io
    audit:
      disabledChecks: [tlsCertificateExpiry]
