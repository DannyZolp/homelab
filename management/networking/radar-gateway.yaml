apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: radar-gateway
  namespace: radar
  annotations:
    cert-manager.io/cluster-issuer: private-issuer
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "${RADAR_GATEWAY_TLD}"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: radar-dzhomelab-net
