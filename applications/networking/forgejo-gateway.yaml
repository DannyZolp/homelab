apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: forgejo-gateway
  namespace: forgejo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-issuer
spec:
  gatewayClassName: cilium
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "${FORGEJO_GATEWAY_TLD}"
      allowedRoutes:
        namespaces:
          from: Same
      tls:
        mode: Terminate
        certificateRefs:
          - name: git-dannyzolp-com
