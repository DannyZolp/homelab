apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 24h
  url: oci://code.forgejo.org/forgejo-helm/forgejo
  ref:
    tag: "17.3.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 12h
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    persistence:
      enabled: true
      storageClass: performance
    gitea:
      config:
        database:
          DB_TYPE: sqlite3
        server:
          ROOT_URL: "https://${FORGEJO_GATEWAY_TLD}/"
          DISABLE_SSH: true
    httpRoute:
      enabled: true
      hostnames:
        - "${FORGEJO_GATEWAY_TLD}"
      parentRefs:
        - name: forgejo-gateway
          sectionName: https
