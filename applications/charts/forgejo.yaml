apiVersion: v1
kind: Namespace
metadata:
  name: forgejo
---
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: forgejo-admin
  namespace: forgejo
type: kubernetes.io/basic-auth
spec:
  itemPath: "${ONEPASSWORD_FORGEJO_ADMIN_ITEM_PATH}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 24h
  url: oci://code.forgejo.org/forgejo-helm/forgejo
  ref:
    tag: "17.3.3"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
  namespace: forgejo
spec:
  interval: 12h
  install:
    strategy:
      name: RetryOnFailure
  upgrade:
    strategy:
      name: RetryOnFailure
  chartRef:
    kind: OCIRepository
    name: forgejo
  values:
    persistence:
      enabled: true
      storageClass: performance
    gitea:
      admin:
        existingSecret: forgejo-admin
        passwordMode: keepUpdated
      additionalConfigFromEnvs:
        - name: FORGEJO__DATABASE__USER
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-credentials
              key: username
        - name: FORGEJO__DATABASE__PASSWD
          valueFrom:
            secretKeyRef:
              name: forgejo-postgres-credentials
              key: password
      config:
        database:
          DB_TYPE: postgres
          HOST: forgejo-postgres-rw:5432
          NAME: forgejo
          SSL_MODE: require
        server:
          ROOT_URL: "https://${FORGEJO_GATEWAY_TLD}/"
          DISABLE_SSH: true
    httpRoute:
      enabled: true
      hostnames:
        - "${FORGEJO_GATEWAY_TLD}"
      parentRefs:
        - name: forgejo-gateway
          sectionName: https
